name: Deploy Executive Revenue Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build immutable self-contained Kartik Clarity branding
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/assets

          # AUTHORITATIVE BRAND SOURCE:
          # These two root SVGs contain the real Kartik Clarity artwork as
          # embedded JPEG data. They have NO external image dependency.
          test -s logo-circle.svg
          test -s logo-rectangle.svg
          grep -q 'data:image/jpeg;base64,' logo-circle.svg
          grep -q 'data:image/jpeg;base64,' logo-rectangle.svg

          cp index.html _site/index.html
          cp logo-circle.svg _site/logo-circle.svg
          cp logo-rectangle.svg _site/logo-rectangle.svg

          if [ -f 404.html ]; then cp 404.html _site/404.html; fi
          touch _site/.nojekyll

          # Force every active visible logo reference to the self-contained
          # official Kartik Clarity artwork at the deployed site root.
          # This deliberately eliminates every JPG/SVG wrapper dependency.
          sed -i -E \
            's#assets/logo-circle\.(svg|jpg|jpeg|png|webp)#logo-circle.svg#g; \
             s#assets/logo-rectangle\.(svg|jpg|jpeg|png|webp)#logo-rectangle.svg#g; \
             s#https://kartikr222\.github\.io/Executive-Revenue-Scorecard/(assets/)?logo-circle\.(svg|jpg|jpeg|png|webp)#logo-circle.svg#g; \
             s#https://kartikr222\.github\.io/Executive-Revenue-Scorecard/(assets/)?logo-rectangle\.(svg|jpg|jpeg|png|webp)#logo-rectangle.svg#g' \
            _site/index.html

          # Verify the final deployed HTML uses ONLY the official
          # self-contained Kartik Clarity SVG artwork.
          echo '--- ACTIVE BRAND REFERENCES ---'
          grep -oE '(^|["'"' ])logo-(circle|rectangle)\.svg' _site/index.html | sort | uniq -c || true

          # No visible logo may point to an image outside the deployed site.
          if grep -nE 'https?://[^"'"' ]*(logo-circle|logo-rectangle)' _site/index.html; then
            echo 'ERROR: external logo URL remains in deployed HTML'
            exit 1
          fi

          # The authoritative SVGs themselves must remain self-contained.
          if grep -nE '<image[^>]+(https?://|\.\./)' _site/logo-circle.svg _site/logo-rectangle.svg; then
            echo 'ERROR: external/relative image dependency remains in logo SVG'
            exit 1
          fi

          test -s _site/logo-circle.svg
          test -s _site/logo-rectangle.svg

          echo 'Kartik Clarity official self-contained logos locked into Pages artifact.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
