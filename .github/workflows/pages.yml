name: Deploy Executive Revenue Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Pages artifact with self-contained permanent brand vectors
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/assets

          # These two SVGs are now self-contained vector artwork. They contain
          # no <image>, no remote URL, no JPEG dependency and no external asset.
          test -s assets/logo-circle.svg
          test -s assets/logo-rectangle.svg
          cp assets/logo-circle.svg _site/assets/logo-circle.svg
          cp assets/logo-rectangle.svg _site/assets/logo-rectangle.svg

          cp index.html _site/index.html
          if [ -f 404.html ]; then cp 404.html _site/404.html; fi
          touch _site/.nojekyll

          # One deterministic local path. GitHub Pages serves this repository at
          # /Executive-Revenue-Scorecard/, so project-relative paths are used.
          sed -i -E \
            's#https://kartikr222\.github\.io/Executive-Revenue-Scorecard/assets/logo-circle\.(svg|jpg|jpeg|png|webp)(\?[^" ]*)?#assets/logo-circle.svg#g; \
             s#https://kartikr222\.github\.io/Executive-Revenue-Scorecard/assets/logo-rectangle\.(svg|jpg|jpeg|png|webp)(\?[^" ]*)?#assets/logo-rectangle.svg#g; \
             s#assets/logo-circle\.(jpg|jpeg|png|webp)#assets/logo-circle.svg#g; \
             s#assets/logo-rectangle\.(jpg|jpeg|png|webp)#assets/logo-rectangle.svg#g' \
            _site/index.html

          echo '--- DEPLOYED BRAND VECTORS ---'
          ls -lh _site/assets/logo-circle.svg _site/assets/logo-rectangle.svg
          file _site/assets/logo-circle.svg _site/assets/logo-rectangle.svg

          test -s _site/assets/logo-circle.svg
          test -s _site/assets/logo-rectangle.svg

          # Hard fail if either vector contains an external image dependency.
          if grep -nE '<image|https?://|href="//|xlink:href' _site/assets/logo-circle.svg _site/assets/logo-rectangle.svg; then
            echo 'ERROR: external/nested image dependency found in logo SVG'
            exit 1
          fi

          echo '--- VERIFY LOGO REFERENCES ---'
          grep -oE 'assets/logo-(circle|rectangle)\.svg' _site/index.html | sort | uniq -c

          # Hard fail if any old raster logo reference remains in visible HTML.
          if grep -nE 'logo-(circle|rectangle)\.(jpg|jpeg|png|webp)' _site/index.html; then
            echo 'ERROR: stale raster logo reference remains'
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
