name: Deploy Executive Revenue Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and permanently validate Kartik Clarity logos and period accuracy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='_site' ./ _site/
          touch _site/.nojekyll

          # FINAL BRAND LOCK: direct local artwork is forced after every other script/style layer.
          sed -i 's#</head>#<link rel="stylesheet" href="assets/logo-final-v2.css?v=final2">\n<script src="period-accuracy.js" defer></script>\n<script src="assets/logo-force.js?v=final2" defer></script>\n</head>#' _site/index.html

          test -s _site/index.html
          test -s _site/period-accuracy.js
          test -s _site/assets/logo-force.js
          test -s _site/assets/kartik-clarity-logo.jpg
          test -s _site/assets/kartik-clarity-mark.jpg
          test -s _site/assets/logo-final-v2.css
          test -s _site/assets/logo-circle.svg
          test -s _site/assets/logo-rectangle.svg

          grep -q 'kartik-clarity-mark.jpg' _site/assets/logo-circle.svg
          grep -q 'kartik-clarity-logo.jpg' _site/assets/logo-rectangle.svg
          grep -q 'logo-force.js' _site/index.html
          grep -q 'q1:' _site/period-accuracy.js
          grep -q 'q2:' _site/period-accuracy.js
          grep -q 'q3:' _site/period-accuracy.js
          grep -q 'fy:' _site/period-accuracy.js

          if grep -RniE 'raw\.githubusercontent\.com|https?://[^" ]*(logo|favicon)|href="\.\./logo-|src="\.\./logo-' _site --include='*.html' --include='*.js' --include='*.css' --include='*.svg'; then
            echo 'ERROR: external or broken logo dependency detected.'
            exit 1
          fi

          test "$(xxd -p -l 2 _site/assets/kartik-clarity-logo.jpg)" = "ffd8"
          test "$(xxd -p -l 2 _site/assets/kartik-clarity-mark.jpg)" = "ffd8"

          echo 'PERMANENT KARTIK CLARITY LOGO SYSTEM VERIFIED.'
          echo 'Q1/Q2/Q3/FY PERIOD DATA SYSTEM VERIFIED.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
