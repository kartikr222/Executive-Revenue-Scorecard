name: Deploy Executive Revenue Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages artifact
        shell: bash
        run: |
          set -e
          rm -rf _site brand-assets
          mkdir -p _site/assets brand-assets
          cp index.html _site/index.html
          cp 404.html _site/404.html
          touch _site/.nojekyll

          # Use the supplied logo ZIP when present. The repository JPEGs remain a fallback.
          for z in logo-fix.zip apply-brand-identity-assets.zip; do
            if [ -f "$z" ]; then
              unzip -oq "$z" -d brand-assets || true
            fi
          done

          circle="$(find brand-assets -type f \( -iname '*circle*.png' -o -iname '*circle*.jpg' -o -iname '*circle*.jpeg' -o -iname '*circle*.webp' \) | head -n 1)"
          rect="$(find brand-assets -type f \( -iname '*rectangle*.png' -o -iname '*rectangle*.jpg' -o -iname '*rectangle*.jpeg' -o -iname '*rectangle*.webp' -o -iname '*banner*.png' -o -iname '*banner*.jpg' -o -iname '*banner*.jpeg' \) | head -n 1)"

          if [ -n "$circle" ]; then
            echo "Using supplied circle logo: $circle"
            /opt/imagemagick/bin/convert "$circle" -auto-orient -strip _site/assets/logo-circle.png
          else
            echo "Using repository circle logo fallback"
            /opt/imagemagick/bin/convert assets/logo-circle.jpg -auto-orient -strip _site/assets/logo-circle.png
          fi

          if [ -n "$rect" ]; then
            echo "Using supplied rectangle logo: $rect"
            /opt/imagemagick/bin/convert "$rect" -auto-orient -strip _site/assets/logo-rectangle.png
          else
            echo "Using repository rectangle logo fallback"
            /opt/imagemagick/bin/convert assets/logo-rectangle.jpg -auto-orient -strip _site/assets/logo-rectangle.png
          fi

          # Replace every logo reference in the page with direct PNG assets.
          sed -i 's#assets/logo-circle\.svg#assets/logo-circle.png#g; s#assets/logo-circle\.jpg#assets/logo-circle.png#g; s#assets/logo-rectangle\.svg#assets/logo-rectangle.png#g; s#assets/logo-rectangle\.jpg#assets/logo-rectangle.png#g' _site/index.html

          # Use absolute GitHub Pages paths + cache-busting so the browser cannot resolve an old/stale relative asset.
          sed -i 's#assets/logo-circle\.png#https://kartikr222.github.io/Executive-Revenue-Scorecard/assets/logo-circle.png?v=final#g; s#assets/logo-rectangle\.png#https://kartikr222.github.io/Executive-Revenue-Scorecard/assets/logo-rectangle.png?v=final#g' _site/index.html

          echo 'Circle:'
          /opt/imagemagick/bin/identify _site/assets/logo-circle.png
          echo 'Rectangle:'
          /opt/imagemagick/bin/identify _site/assets/logo-rectangle.png
          test -s _site/assets/logo-circle.png
          test -s _site/assets/logo-rectangle.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
