name: Deploy Executive Revenue Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Pages artifact with the official Kartik Clarity image assets
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/assets

          # The JPG files are the supplied official Kartik Clarity brand artwork.
          # Deploy those exact files directly. Do not route visible branding
          # through SVG wrappers, nested images, remote URLs, or generated marks.
          test -s assets/logo-circle.jpg
          test -s assets/logo-rectangle.jpg
          cp assets/logo-circle.jpg _site/assets/logo-circle.jpg
          cp assets/logo-rectangle.jpg _site/assets/logo-rectangle.jpg

          cp index.html _site/index.html
          if [ -f 404.html ]; then cp 404.html _site/404.html; fi
          touch _site/.nojekyll

          # Rewrite every active branding reference to the actual supplied
          # Kartik Clarity JPG artwork. Project-relative paths are required for
          # GitHub Pages at /Executive-Revenue-Scorecard/.
          sed -i -E \
            's#https://kartikr222\.github\.io/Executive-Revenue-Scorecard/assets/logo-circle\.(svg|jpg|jpeg|png|webp)(\?[^" ]*)?#assets/logo-circle.jpg#g; \
             s#https://kartikr222\.github\.io/Executive-Revenue-Scorecard/assets/logo-rectangle\.(svg|jpg|jpeg|png|webp)(\?[^" ]*)?#assets/logo-rectangle.jpg#g; \
             s#assets/logo-circle\.(svg|jpeg|png|webp)#assets/logo-circle.jpg#g; \
             s#assets/logo-rectangle\.(svg|jpeg|png|webp)#assets/logo-rectangle.jpg#g' \
            _site/index.html

          echo '--- OFFICIAL KARTIK CLARITY BRAND ASSETS ---'
          ls -lh _site/assets/logo-circle.jpg _site/assets/logo-rectangle.jpg
          file _site/assets/logo-circle.jpg _site/assets/logo-rectangle.jpg

          test -s _site/assets/logo-circle.jpg
          test -s _site/assets/logo-rectangle.jpg

          echo '--- VERIFY ACTIVE LOGO REFERENCES ---'
          grep -oE 'assets/logo-(circle|rectangle)\.jpg' _site/index.html | sort | uniq -c

          # Fail deployment if the visible HTML still points at an SVG logo.
          if grep -nE 'assets/logo-(circle|rectangle)\.svg' _site/index.html; then
            echo 'ERROR: SVG logo reference remains in deployed HTML'
            exit 1
          fi

          # Fail deployment if an external logo URL remains.
          if grep -nE 'https?://[^" ]*(logo-circle|logo-rectangle)' _site/index.html; then
            echo 'ERROR: external logo URL remains in deployed HTML'
            exit 1
          fi

          echo 'Official Kartik Clarity logo assets verified for deployment.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
