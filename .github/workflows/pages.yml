name: Deploy Executive Revenue Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site /tmp/brand
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp final-polish.css _site/final-polish.css
          cp final-polish.js _site/final-polish.js
          cp report-builder.css _site/report-builder.css
          cp report-builder.js _site/report-builder.js
          cp universal-product-layer.css _site/universal-product-layer.css
          cp universal-product-layer.js _site/universal-product-layer.js
          touch _site/.nojekyll
          if [ -f assets/logo-circle.jpg ]; then cp assets/logo-circle.jpg _site/assets/logo-circle.jpg; fi
          if [ -f assets/logo-rectangle.jpg ]; then cp assets/logo-rectangle.jpg _site/assets/logo-rectangle.jpg; fi
          if [ -f assets/logo-circle.svg ]; then cp assets/logo-circle.svg _site/assets/logo-circle.svg; fi
          if [ -f assets/logo-rectangle.svg ]; then cp assets/logo-rectangle.svg _site/assets/logo-rectangle.svg; fi
          if [ -f apply-brand-identity-assets.zip ]; then mkdir -p /tmp/brand; unzip -oq apply-brand-identity-assets.zip -d /tmp/brand; fi
          circle="$(find /tmp/brand -type f \( -iname 'logo-circle.jpg' -o -iname 'logo-circle.jpeg' -o -iname 'logo-circle.png' \) | head -n 1 || true)"
          rect="$(find /tmp/brand -type f \( -iname 'logo-rectangle.jpg' -o -iname 'logo-rectangle.jpeg' -o -iname 'logo-rectangle.png' \) | head -n 1 || true)"
          if [ ! -f _site/assets/logo-circle.jpg ] && [ -n "${circle}" ]; then cp "${circle}" _site/assets/logo-circle.jpg; fi
          if [ ! -f _site/assets/logo-rectangle.jpg ] && [ -n "${rect}" ]; then cp "${rect}" _site/assets/logo-rectangle.jpg; fi
          test -f _site/assets/logo-circle.svg
          test -f _site/assets/logo-rectangle.svg
          test -f _site/assets/logo-circle.jpg
          test -f _site/assets/logo-rectangle.jpg
          sed -i 's#assets/logo-circle\.jpg#assets/logo-circle.svg#g; s#assets/logo-rectangle\.jpg#assets/logo-rectangle.svg#g' _site/index.html
          sed -i 's#</head>#<link rel="stylesheet" href="final-polish.css"><link rel="stylesheet" href="report-builder.css"><link rel="stylesheet" href="universal-product-layer.css"></head>#' _site/index.html
          sed -i 's#</body>#<script src="final-polish.js" defer></script><script src="report-builder.js" defer></script><script src="universal-product-layer.js" defer></script></body>#' _site/index.html
          ! grep -q 'src="assets/logo-circle.jpg"\|src="assets/logo-rectangle.jpg"' _site/index.html
          grep -q 'assets/logo-circle.svg' _site/index.html
          grep -q 'assets/logo-rectangle.svg' _site/index.html
          grep -q 'Kartik Clarity' _site/universal-product-layer.js
          grep -q 'Reporting year' _site/report-builder.js
          test -f _site/index.html
          test -f _site/report-builder.js
          test -f _site/universal-product-layer.js
          test -f _site/assets/logo-circle.svg
          test -f _site/assets/logo-rectangle.svg
          find _site -maxdepth 2 -type f -print
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
