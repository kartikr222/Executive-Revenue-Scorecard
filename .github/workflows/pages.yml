name: Deploy Executive Revenue Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static Pages artifact with permanent local brand assets
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site/assets

          # Copy the real, repository-owned Kartik Clarity artwork directly.
          # Do not route visible logos through SVG wrappers or external URLs.
          test -s assets/logo-circle.jpg
          test -s assets/logo-rectangle.jpg
          cp assets/logo-circle.jpg _site/assets/logo-circle.jpg
          cp assets/logo-rectangle.jpg _site/assets/logo-rectangle.jpg

          cp index.html _site/index.html
          if [ -f 404.html ]; then cp 404.html _site/404.html; fi
          touch _site/.nojekyll

          # Make every visible logo reference use the actual local raster artwork.
          # Relative project paths are intentional: GitHub Pages serves this repo at
          # /Executive-Revenue-Scorecard/, so root-relative /assets paths are unsafe.
          sed -i -E \
            's#assets/logo-circle\.(svg|jpg|jpeg|png|webp)(\?[^" ]*)?#assets/logo-circle.jpg#g; \
             s#assets/logo-rectangle\.(svg|jpg|jpeg|png|webp)(\?[^" ]*)?#assets/logo-rectangle.jpg#g; \
             s#https://kartikr222\.github\.io/Executive-Revenue-Scorecard/assets/logo-circle\.(svg|jpg|jpeg|png|webp)(\?[^" ]*)?#assets/logo-circle.jpg#g; \
             s#https://kartikr222\.github\.io/Executive-Revenue-Scorecard/assets/logo-rectangle\.(svg|jpg|jpeg|png|webp)(\?[^" ]*)?#assets/logo-rectangle.jpg#g' \
            _site/index.html

          # Remove stale SVG fallback references too, so the browser has one
          # deterministic visible asset and never falls back to a missing wrapper.
          sed -i 's#assets/logo-circle\.svg#assets/logo-circle.jpg#g; s#assets/logo-rectangle\.svg#assets/logo-rectangle.jpg#g' _site/index.html

          echo '--- DEPLOYED BRAND ASSETS ---'
          ls -lh _site/assets/logo-circle.jpg _site/assets/logo-rectangle.jpg
          file _site/assets/logo-circle.jpg _site/assets/logo-rectangle.jpg

          test -s _site/assets/logo-circle.jpg
          test -s _site/assets/logo-rectangle.jpg

          echo '--- VERIFY NO VISIBLE SVG LOGO REFERENCES REMAIN ---'
          if grep -nE 'logo-(circle|rectangle)\.svg' _site/index.html; then
            echo 'ERROR: stale SVG logo reference remains'
            exit 1
          fi

          echo '--- VERIFY LOCAL RASTER REFERENCES ---'
          grep -oE 'assets/logo-(circle|rectangle)\.jpg' _site/index.html | sort | uniq -c

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
