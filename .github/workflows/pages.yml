name: Deploy Executive Revenue Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare and harden production logo assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='_site' ./ _site/
          touch _site/.nojekyll

          test -s _site/index.html
          test -s _site/assets/kartik-clarity-logo.jpg
          test -s _site/assets/kartik-clarity-mark.jpg

          # Normalize every legacy logo reference across the COMPLETE deploy artifact.
          find _site -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.svg' \) -print0 | xargs -0 sed -i \
            -e 's#assets/logo-circle\.svg#assets/kartik-clarity-mark.jpg#g' \
            -e 's#assets/logo-rectangle\.svg#assets/kartik-clarity-logo.jpg#g' \
            -e 's#assets/logo-circle\.jpg#assets/kartik-clarity-mark.jpg#g' \
            -e 's#assets/logo-rectangle\.jpg#assets/kartik-clarity-logo.jpg#g'

          # The deployed artifact must contain ONLY direct local Kartik Clarity logo assets.
          if grep -RniE 'logo-circle\.svg|logo-rectangle\.svg|raw\.githubusercontent\.com|https?://[^"'"'"' ]*logo|href="\.\./logo-|src="\.\./logo-' _site --include='*.html' --include='*.js' --include='*.css' --include='*.svg'; then
            echo 'ERROR: legacy, external, or broken logo dependency detected.'
            exit 1
          fi

          # Validate actual JPEG signatures, not merely non-empty files.
          test "$(xxd -p -l 2 _site/assets/kartik-clarity-logo.jpg)" = "ffd8"
          test "$(xxd -p -l 2 _site/assets/kartik-clarity-mark.jpg)" = "ffd8"

          grep -Rql 'assets/kartik-clarity-logo.jpg' _site --include='*.html' --include='*.js' --include='*.css'
          grep -Rql 'assets/kartik-clarity-mark.jpg' _site --include='*.html' --include='*.js' --include='*.css'
          echo 'Permanent local Kartik Clarity logo system verified.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
