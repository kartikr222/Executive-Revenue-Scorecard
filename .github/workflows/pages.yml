name: Deploy Executive Revenue Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and prepare exact repository site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='_site' ./ _site/
          touch _site/.nojekyll

          test -s _site/index.html
          test -s _site/assets/logo-circle.jpg
          test -s _site/assets/logo-rectangle.jpg
          test -s _site/assets/logo-circle.svg
          test -s _site/assets/logo-rectangle.svg

          grep -q 'logo-circle.jpg' _site/assets/logo-circle.svg
          grep -q 'logo-rectangle.jpg' _site/assets/logo-rectangle.svg

          if grep -RniE 'raw\.githubusercontent\.com|https?://[^"'"'"' ]*logo|href="\.\./logo-|src="\.\./logo-' _site --include='*.html' --include='*.js' --include='*.css' --include='*.svg'; then
            echo 'ERROR: external or broken logo dependency detected.'
            exit 1
          fi

          echo 'Kartik Clarity local logo assets and references verified in final Pages artifact.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
