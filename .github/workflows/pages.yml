name: Deploy Executive Revenue Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        shell: bash
        run: |
          set -e
          rm -rf _site
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp 404.html _site/404.html
          cp final-polish.js _site/final-polish.js
          cp assets/logo-circle.jpg _site/assets/logo-circle.jpg
          cp assets/logo-rectangle.jpg _site/assets/logo-rectangle.jpg
          touch _site/.nojekyll
          sed -i 's#assets/logo-circle\.svg#assets/logo-circle.jpg#g' _site/index.html
          sed -i 's#assets/logo-rectangle\.svg#assets/logo-rectangle.jpg#g' _site/index.html
          echo "Circle logo:"; file _site/assets/logo-circle.jpg
          echo "Rectangle logo:"; file _site/assets/logo-rectangle.jpg
          ls -lh _site/assets/logo-circle.jpg _site/assets/logo-rectangle.jpg
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
