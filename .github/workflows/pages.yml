name: Deploy Executive Revenue Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare final static product
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site /tmp/brand /tmp/brand-legacy /tmp/logo-fix
          mkdir -p _site/assets /tmp/brand /tmp/brand-legacy /tmp/logo-fix
          cp index.html _site/index.html
          cp 404.html _site/404.html
          touch _site/.nojekyll

          # Start with repository fallbacks.
          if [ -f assets/logo-circle.jpg ]; then cp assets/logo-circle.jpg _site/assets/logo-circle.jpg; fi
          if [ -f assets/logo-rectangle.jpg ]; then cp assets/logo-rectangle.jpg _site/assets/logo-rectangle.jpg; fi
          if [ -f assets/logo-circle.svg ]; then cp assets/logo-circle.svg _site/assets/logo-circle.svg; fi
          if [ -f assets/logo-rectangle.svg ]; then cp assets/logo-rectangle.svg _site/assets/logo-rectangle.svg; fi

          # Prefer the newest explicit logo-fix package, then the older brand package.
          # This prevents stale/corrupt generated logo assets from winning during deployment.
          if [ -f logo-fix.zip ]; then unzip -oq logo-fix.zip -d /tmp/logo-fix; fi
          if [ -f apply-brand-identity-assets.zip ]; then unzip -oq apply-brand-identity-assets.zip -d /tmp/brand-legacy; fi

          find_logo() {
            local root="$1"; local kind="$2"
            find "$root" -type f \( -iname "*${kind}*.jpg" -o -iname "*${kind}*.jpeg" -o -iname "*${kind}*.png" \) -print -quit
          }

          circle="$(find_logo /tmp/logo-fix circle || true)"
          rect="$(find_logo /tmp/logo-fix rectangle || true)"
          if [ -z "${circle}" ]; then circle="$(find_logo /tmp/brand-legacy circle || true)"; fi
          if [ -z "${rect}" ]; then rect="$(find_logo /tmp/brand-legacy rectangle || true)"; fi

          if [ -n "${circle}" ]; then cp "${circle}" _site/assets/logo-circle.jpg; fi
          if [ -n "${rect}" ]; then cp "${rect}" _site/assets/logo-rectangle.jpg; fi

          # Fail the build rather than publish a page with missing brand assets.
          test -f _site/index.html
          test -f _site/404.html
          test -s _site/assets/logo-circle.jpg
          test -s _site/assets/logo-rectangle.jpg
          test -f _site/assets/logo-circle.svg
          test -f _site/assets/logo-rectangle.svg
          grep -q 'Find a tool' _site/index.html
          grep -q 'Build your executive report' _site/index.html
          grep -q 'Print / Save PDF' _site/index.html
          grep -q 'Reporting year' _site/index.html
          grep -q 'Ctrl K' _site/index.html

          # Verify the actual binary files are real JPEGs before publishing.
          test "$(xxd -p -l 2 _site/assets/logo-circle.jpg)" = "ffd8"
          test "$(xxd -p -l 2 _site/assets/logo-rectangle.jpg)" = "ffd8"

          find _site -maxdepth 2 -type f -print
          file _site/assets/logo-circle.jpg _site/assets/logo-rectangle.jpg
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
