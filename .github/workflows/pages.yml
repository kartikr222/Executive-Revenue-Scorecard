name: Deploy Executive Revenue Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site brand-assets
          mkdir -p _site/assets brand-assets
          cp index.html _site/index.html
          cp 404.html _site/404.html
          touch _site/.nojekyll

          # Extract the supplied logo package(s). The uploaded artwork is the source of truth.
          for z in logo-fix.zip apply-brand-identity-assets.zip; do
            if [ -f "$z" ]; then unzip -oq "$z" -d brand-assets || true; fi
          done

          # Locate the actual supplied images. If filenames are opaque, classify them by aspect ratio.
          CIRCLE=""
          RECT=""
          while IFS= read -r f; do
            dims="$(identify -format '%w %h' "$f" 2>/dev/null || true)"
            [ -n "$dims" ] || continue
            w="${dims% *}"; h="${dims#* }"
            [ "$w" -gt 0 ] && [ "$h" -gt 0 ] || continue
            diff=$(( w > h ? w-h : h-w )); max=$(( w > h ? w : h ))
            if [ -z "$CIRCLE" ] && [ $((diff*100)) -le $((max*12)) ]; then CIRCLE="$f"; fi
            if [ -z "$RECT" ] && [ $((w*100)) -ge $((h*135)) ]; then RECT="$f"; fi
          done < <(find brand-assets -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) | sort -u)

          if [ -z "$CIRCLE" ]; then CIRCLE="assets/logo-circle.jpg"; fi
          if [ -z "$RECT" ]; then RECT="assets/logo-rectangle.jpg"; fi
          echo "Circle source: $CIRCLE"
          echo "Rectangle source: $RECT"

          # Normalize both supplied logos to PNG. PNG is the visible browser source; no SVG nesting is involved.
          convert "$CIRCLE" -auto-orient -strip _site/assets/logo-circle.png
          convert "$RECT" -auto-orient -strip _site/assets/logo-rectangle.png

          # Every logo in the page points to the direct PNG assets.
          sed -i 's#assets/logo-circle\.svg#assets/logo-circle.png#g; s#assets/logo-circle\.jpg#assets/logo-circle.png#g; s#assets/logo-rectangle\.svg#assets/logo-rectangle.png#g; s#assets/logo-rectangle\.jpg#assets/logo-rectangle.png#g' _site/index.html
          sed -i 's#assets/logo-circle\.png#https://kartikr222.github.io/Executive-Revenue-Scorecard/assets/logo-circle.png?v=final#g; s#assets/logo-rectangle\.png#https://kartikr222.github.io/Executive-Revenue-Scorecard/assets/logo-rectangle.png?v=final#g' _site/index.html

          echo '--- DEPLOYED LOGOS ---'
          identify _site/assets/logo-circle.png
          identify _site/assets/logo-rectangle.png
          test -s _site/assets/logo-circle.png
          test -s _site/assets/logo-rectangle.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
