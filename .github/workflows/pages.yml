name: Deploy Executive Revenue Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site and canonical logos
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp 404.html _site/404.html
          cp final-polish.js _site/final-polish.js
          touch _site/.nojekyll

          # The committed assets are the exact supplied Kartik Clarity logos.
          cp assets/logo-circle.jpg _site/assets/logo-circle.jpg
          cp assets/logo-rectangle.jpg _site/assets/logo-rectangle.jpg

          # GitHub Pages serves these raster assets directly. Do not depend on
          # nested-image SVG wrappers or ZIP extraction for first paint.
          sed -i 's#assets/logo-circle\.svg#assets/logo-circle.jpg#g' _site/index.html
          sed -i 's#assets/logo-rectangle\.svg#assets/logo-rectangle.jpg#g' _site/index.html

          test -s _site/index.html
          test -s _site/assets/logo-circle.jpg
          test -s _site/assets/logo-rectangle.jpg
          file _site/assets/logo-circle.jpg | grep -qi 'jpeg'
          file _site/assets/logo-rectangle.jpg | grep -qi 'jpeg'
          grep -q 'assets/logo-circle.jpg' _site/index.html
          grep -q 'assets/logo-rectangle.jpg' _site/index.html

          echo '=== FINAL BRAND ASSETS ==='
          file _site/assets/logo-circle.jpg
          file _site/assets/logo-rectangle.jpg
          ls -lh _site/assets/logo-circle.jpg _site/assets/logo-rectangle.jpg
          echo '=== PUBLISHING ==='
          find _site -maxdepth 2 -type f -print

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
