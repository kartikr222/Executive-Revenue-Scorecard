name: Deploy Executive Revenue Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and permanently validate local Kartik Clarity logos
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='_site' ./ _site/
          touch _site/.nojekyll

          test -s _site/index.html
          test -s _site/assets/kartik-clarity-logo.jpg
          test -s _site/assets/kartik-clarity-mark.jpg
          test -s _site/assets/logo-circle.svg
          test -s _site/assets/logo-rectangle.svg

          # The SVGs are intentionally local wrappers around the verified local artwork.
          grep -q 'kartik-clarity-mark.jpg' _site/assets/logo-circle.svg
          grep -q 'kartik-clarity-logo.jpg' _site/assets/logo-rectangle.svg

          # No external or parent-directory logo dependencies may reach production.
          if grep -RniE 'raw\.githubusercontent\.com|https?://[^"'"'"' ]*(logo|favicon)|href="\.\./logo-|src="\.\./logo-' _site --include='*.html' --include='*.js' --include='*.css' --include='*.svg'; then
            echo 'ERROR: external or broken logo dependency detected.'
            exit 1
          fi

          # Validate actual JPEG signatures.
          test "$(xxd -p -l 2 _site/assets/kartik-clarity-logo.jpg)" = "ffd8"
          test "$(xxd -p -l 2 _site/assets/kartik-clarity-mark.jpg)" = "ffd8"

          echo 'PERMANENT KARTIK CLARITY LOGO SYSTEM VERIFIED.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
