name: Deploy Executive Revenue Scorecard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare final static product
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site /tmp/brand /tmp/brand-legacy
          mkdir -p _site/assets /tmp/brand /tmp/brand-legacy
          cp index.html _site/index.html
          cp 404.html _site/404.html
          touch _site/.nojekyll

          # Start with repository fallbacks.
          if [ -f assets/logo-circle.jpg ]; then cp assets/logo-circle.jpg _site/assets/logo-circle.jpg; fi
          if [ -f assets/logo-rectangle.jpg ]; then cp assets/logo-rectangle.jpg _site/assets/logo-rectangle.jpg; fi
          if [ -f assets/logo-circle.svg ]; then cp assets/logo-circle.svg _site/assets/logo-circle.svg; fi
          if [ -f assets/logo-rectangle.svg ]; then cp assets/logo-rectangle.svg _site/assets/logo-rectangle.svg; fi

          # Prefer the user's supplied brand package over any older generated logo files.
          if [ -f apply-brand-identity-assets.zip ]; then
            unzip -oq apply-brand-identity-assets.zip -d /tmp/brand
          fi
          circle="$(find /tmp/brand -type f \( -iname 'logo-circle.jpg' -o -iname 'logo-circle.jpeg' -o -iname 'logo-circle.png' \) | head -n 1 || true)"
          rect="$(find /tmp/brand -type f \( -iname 'logo-rectangle.jpg' -o -iname 'logo-rectangle.jpeg' -o -iname 'logo-rectangle.png' \) | head -n 1 || true)"
          if [ -n "${circle}" ]; then cp "${circle}" _site/assets/logo-circle.jpg; fi
          if [ -n "${rect}" ]; then cp "${rect}" _site/assets/logo-rectangle.jpg; fi

          test -f _site/index.html
          test -f _site/404.html
          test -f _site/assets/logo-circle.svg
          test -f _site/assets/logo-rectangle.svg
          test -f _site/assets/logo-circle.jpg
          test -f _site/assets/logo-rectangle.jpg
          ! grep -q 'src="assets/logo-circle.jpg"\|src="assets/logo-rectangle.jpg"' _site/index.html
          grep -q 'assets/logo-circle.svg' _site/index.html
          grep -q 'assets/logo-rectangle.svg' _site/index.html
          grep -q 'Build your executive report' _site/index.html
          grep -q 'Find a tool' _site/index.html
          grep -q 'Print / Save PDF' _site/index.html
          grep -q 'Reporting year' _site/index.html
          grep -q 'Ctrl K' _site/index.html
          find _site -maxdepth 2 -type f -print
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
